plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = 'me.octo.recovery'
version = '1.0.0-recovery'

repositories { mavenCentral() }

// Dependencies already bundled in the supplied JAR, excluding recovered project code.
def bundledLibraries = tasks.register('prepareBundledLibraries', Jar) {
    archiveFileName = 'bundled-libraries.jar'
    destinationDirectory = layout.buildDirectory.dir('recovery-deps')
    from(zipTree(file('../inputs/PoliSlop.jar'))) {
        include '**/*.class'
        exclude 'me/octo/**', 'dev/jnic/**'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"
    compileOnly files(bundledLibraries.flatMap { it.archiveFile })
}

sourceSets.main.java.srcDirs = ['../reference/client/src/main/java']
sourceSets.main.resources.srcDirs = []

def originalResources = tasks.register('extractOriginalResources', Sync) {
    from(zipTree(file('../inputs/PoliSlop.jar'))) {
        exclude '**/*.class', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    }
    into layout.buildDirectory.dir('original-resources')
}

tasks.named('processResources') {
    dependsOn originalResources
    from originalResources
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('writeRecoveryClasspath') {
    dependsOn bundledLibraries
    def output = layout.buildDirectory.file('recovery-classpath.txt')
    outputs.file output
    doLast { output.get().asFile.text = sourceSets.main.compileClasspath.asPath }
}
